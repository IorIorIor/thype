<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>thype</title>
  <meta name="description" content="the world's simplest journal — a black space, stars, and your thoughts">
  <meta name="theme-color" content="#05030f">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="thype">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="stars"></canvas>
  <canvas id="particles"></canvas>

  <!-- auth view -->
  <section id="view-auth" class="view" hidden>
    <div class="auth-box">
      <h1 class="auth-title">thype</h1>
      <p class="auth-sub">your thoughts, kept among the stars</p>
      <form id="auth-form">
        <input id="auth-user" type="text" placeholder="name" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="2" maxlength="32">
        <input id="auth-pass" type="password" placeholder="secret" autocomplete="current-password" required minlength="6">
        <p id="auth-error" class="auth-error" hidden></p>
        <button type="submit" id="auth-submit" class="auth-submit">enter</button>
      </form>
      <button id="auth-toggle" class="auth-toggle">new here? create an account</button>
    </div>
  </section>

  <!-- write view -->
  <section id="view-write" class="view">
    <button id="btn-overview" class="orb-btn" aria-label="your thoughts" title="your thoughts">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5l9-7.5 9 7.5"/>
        <path d="M5.5 8.8V20h13V8.8"/>
      </svg>
    </button>
    <div class="top-actions">
      <button id="btn-delete" hidden>delete</button>
      <button id="btn-save" hidden>save</button>
    </div>
    <div id="editor" contenteditable="true" autofocus inputmode="text" enterkeyhint="enter" spellcheck="false" data-placeholder="what's on your mind…"></div>
  </section>

  <!-- timeline view -->
  <section id="view-timeline" class="view" hidden>
    <header class="bar">
      <span class="orb-btn ghost"></span>
      <h1 id="timeline-title">thoughts</h1>
      <button id="btn-themes" class="orb-btn" aria-label="settings" title="settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>
    <p id="ai-status" class="ai-status" hidden></p>
    <button id="btn-new" class="new-thought" aria-label="new thought" title="new thought">+</button>
    <div id="timeline" class="timeline"></div>
  </section>

  <!-- themes view -->
  <section id="view-themes" class="view" hidden>
    <header class="bar">
      <button id="btn-back" class="orb-btn" aria-label="your thoughts" title="your thoughts">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5l9-7.5 9 7.5"/>
          <path d="M5.5 8.8V20h13V8.8"/>
        </svg>
      </button>
      <h1>themes</h1>
      <span class="bar-right">
        <button id="btn-remind" class="orb-btn" aria-label="evening reminder" title="evening reminder">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 9a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6M10.5 18a1.8 1.8 0 0 0 3 0"/>
          </svg>
        </button>
        <button id="btn-logout" class="orb-btn" aria-label="leave" title="leave">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M9 5H5v14h4M13 8l4 4-4 4M17 12H8"/>
          </svg>
        </button>
      </span>
    </header>
    <p id="remind-note" class="ai-status" hidden></p>
    <div id="themes" class="themes"></div>
  </section>

  <!-- logout confirmation -->
  <div id="logout-modal" class="modal-scrim" hidden>
    <div class="modal">
      <p>leave the stars?</p>
      <div class="modal-actions">
        <button id="logout-no">stay</button>
        <button id="logout-yes">leave</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
