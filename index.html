<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>thype</title>
  <meta name="description" content="the world's simplest journal — a black space, stars, and your thoughts">
  <meta name="theme-color" content="#05030f">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="thype">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="stars"></canvas>
  <canvas id="particles"></canvas>

  <!-- auth view -->
  <section id="view-auth" class="view" hidden>
    <div class="auth-box">
      <h1 class="auth-title">thype</h1>
      <p class="auth-sub">your thoughts, kept among the stars</p>
      <form id="auth-form">
        <input id="auth-user" type="text" placeholder="name" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="2" maxlength="32">
        <input id="auth-pass" type="password" placeholder="secret" autocomplete="current-password" required minlength="6">
        <p id="auth-error" class="auth-error" hidden></p>
        <button type="submit" id="auth-submit" class="auth-submit">enter</button>
      </form>
      <button id="auth-toggle" class="auth-toggle">new here? create an account</button>
    </div>
  </section>

  <!-- write view -->
  <section id="view-write" class="view">
    <button id="btn-overview" class="orb-btn" aria-label="your thoughts" title="your thoughts">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="6" cy="18" r="1.6" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="10" r="1.6" fill="currentColor" stroke="none"/>
        <circle cx="18" cy="15" r="1.6" fill="currentColor" stroke="none"/>
        <path d="M7 17l4-6M13 10.5l4 3.5" opacity=".5"/>
      </svg>
    </button>
    <button id="btn-delete" class="orb-btn danger" hidden aria-label="let it go" title="let it go">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/>
      </svg>
    </button>
    <div id="editor" contenteditable="true" autofocus inputmode="text" enterkeyhint="enter" spellcheck="false" data-placeholder="what's on your mind…"></div>
    <button id="btn-save" class="save-pill" hidden>save</button>
  </section>

  <!-- timeline view -->
  <section id="view-timeline" class="view" hidden>
    <header class="bar">
      <button id="btn-write" class="orb-btn" aria-label="new thought" title="new thought">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <h1 id="timeline-title">thoughts</h1>
      <button id="btn-themes" class="orb-btn" aria-label="themes" title="themes">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z"/>
        </svg>
      </button>
    </header>
    <p id="ai-status" class="ai-status" hidden></p>
    <div id="timeline" class="timeline"></div>
  </section>

  <!-- themes view -->
  <section id="view-themes" class="view" hidden>
    <header class="bar">
      <button id="btn-back" class="orb-btn" aria-label="back" title="back">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </button>
      <h1>themes</h1>
      <button id="btn-logout" class="orb-btn" aria-label="leave" title="leave">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M9 5H5v14h4M13 8l4 4-4 4M17 12H8"/>
        </svg>
      </button>
    </header>
    <div id="themes" class="themes"></div>
  </section>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
